# Los textos del tutorial (Tutorial, tour_controller.js), en palabras de quien usa la app. Qué pasos le tocan
# a cada persona, en qué página y qué iluminan lo decide Tutorial#steps según lo que puede hacer; aquí solo va
# lo que se lee. %{name} es su nombre de pila y %{role_notes} para quién son las notas de la agenda.
#
#   title:  el título de la tarjeta
#   text:   lo que explica (o pide hacer)
#   result: después de practicar, lo que pasó (y que no se guardó)
welcome:
  title: "Hola, %{name}"
  text: "En 5 minutos te mostramos lo que vas a usar en la semana, sobre la app de verdad, y lo practicas. Lo que practiques no se guarda. Puedes saltarlo y verlo después desde Configuración."
kpis:
  title: Tus cifras de un vistazo
  text: Lo más importante de tu rol, siempre al día. Toca cualquiera para ir al detalle.
own_company:
  title: Tu compañía
  text: Aquí están tus jóvenes. Tócalo.
own_branch:
  title: Tu rama
  text: Las compañías de tu rama, con sus consejeros y jóvenes. Tócalo.
own_companies:
  title: Todas las compañías
  text: Sus consejeros, sus jóvenes y el organigrama. Puedes mover a cualquiera.
own_area:
  title: Tu área
  text: Este botón te lleva directo al módulo de tu área de logística.
practice_joven:
  title: La ficha de un joven
  text: "Arriba están los jóvenes de práctica: son de ejemplo y solo aparecen en el tutorial. Toca a Sofía Práctica para abrir su ficha."
ficha_infirmary:
  title: ¿Lo llevas a enfermería?
  text: "En la ficha está su información médica. Toca «Enfermería» para abrir su ficha de enfermería."
chart_announce:
  title: Su ficha de enfermería
  text: "Toca «Llevar a enfermería»."
announce_reason:
  title: Elige el motivo
  text: "Toca por qué lo llevas. Abajo puedes escribir qué pasó: lo leen enfermería, sus consejeros, su auxiliar y la dirección."
announce_form:
  title: Avisa que lo llevas
  text: "Toca el botón. En la semana, enfermería ya lo espera y su auxiliar se entera."
  result_title: "Práctica: enfermería no recibió nada"
  result: "Así se avisa. Queda «En camino» y puedes retirar el aviso si al final no van. Enfermería te avisa si sale a su casa o al hospital, nunca el detalle clínico."
center_qr:
  title: Tu código QR
  text: El botón amarillo. Lo muestras al llegar al evento y en cada capacitación; registro lo escanea y queda tu asistencia.
center_checkin:
  title: Registro de llegadas
  text: "El botón amarillo, porque tu área es Registro: recibes a la gente escaneando el QR de su gafete y la llegada queda anotada con la hora; si te equivocas, la anulas ahí mismo. Tu propio QR está en «Más»."
center_search:
  title: Busca cualquier cosa
  text: "El botón amarillo: una persona, una compañía, una estaca o un módulo. Es el camino más corto a cualquier ficha."
agenda_tab:
  title: La agenda
  text: "Toca «Agenda» para ver qué sigue."
activity:
  title: Despliega una actividad
  text: Toca una actividad para ver su detalle.
activity_detail:
  title: Todo lo de esa actividad
  text: "Horario, lugar, responsables y la nota para %{role_notes}. Si algo cambia, te llega una alerta."
agenda_empty:
  title: La agenda todavía está vacía
  text: Cuando la dirección cargue las actividades, aparecen aquí día por día. Tocas una y se despliega su horario, lugar y la nota para tu rol.
trainings_tab:
  title: Capacitaciones
  text: "Al lado de la agenda están las capacitaciones del staff. Tócalo."
training_swipe:
  title: Borra deslizando
  text: "Desliza una capacitación hacia la izquierda y toca «Eliminar». Pruébalo con una de verdad: en el tutorial no se borra."
  result_title: "Práctica: no se borró"
  result: "La capacitación sigue ahí. En la semana, la app te pide confirmar, dice cuántas asistencias se pierden y la borra."
bell:
  title: La campanita
  text: "Aquí llegan los avisos de la dirección y los cambios de agenda. Tócala."
notification_swipe:
  title: Desliza para borrar
  text: "Arriba está tu alerta de bienvenida, que el tutorial te acaba de enviar. Deslízala hacia la izquierda y toca «Eliminar»."
  result_title: Esta sí se borró
  result: "Era solo tuya, así que borrarla no afecta a nadie. Así quitas de tu lista cualquier alerta; para los demás sigue ahí."
notification_swipe_preview:
  title: Desliza para borrar
  text: "Aquí la persona recibe una alerta de bienvenida del tutorial y practica borrarla deslizándola a la izquierda. Viendo como ella no se le envía nada."
more:
  title: Más opciones
  text: "Lo demás está en «Más». Tócalo. Se cierra tocando fuera o arrastrándolo hacia abajo."
sheet_scan:
  title: Escanear gafete
  text: "Tócalo."
scan:
  title: La ficha de cualquier joven
  text: "Activas la cámara y apuntas al QR del gafete de cualquier joven: se abre su ficha con alergias, contacto de emergencia y compañía. Sirve si encuentras a alguien solo."
more_manuals:
  title: Los manuales
  text: "Los manuales del FSY se leen dentro de la app. Abre «Más» otra vez."
sheet_manuals:
  title: Manuales
  text: "Toca «Manuales»."
manuals:
  title: Los manuales del FSY
  text: "Aquí están el manual de los jóvenes y el de líderes. Se leen dentro de la app y recuerdan en qué página ibas. Abajo están los enlaces a la Biblioteca del Evangelio."
more_conteo:
  title: El Conteo
  text: "Cada noche se pasa lista. Abre «Más» otra vez."
sheet_conteo:
  title: Abre el Conteo
  text: "Toca «Conteo»."
conteo_mark:
  title: Marca a cada joven
  text: "Es una lista de práctica. Toca a un joven para marcarlo presente, o «Falta» para marcarlo ausente con el motivo. Márcalos a todos."
conteo_confirm:
  title: Confirma la lista
  text: "Con todos marcados, se confirma. Toca el botón."
  result_title: "Práctica: la lista no se guardó"
  result: "Así queda una lista confirmada. Esta noche la pasas normal; quien está en enfermería ya viene marcado, y a las 10 pm la dirección ve qué listas faltan."
alert_form:
  title: Enviar una alerta
  text: "Este es el formulario de verdad: un título, el mensaje y a quién le llega (a todos o solo a ciertos roles)."
alert_send:
  title: Envíala
  text: "Toca «Enviar alerta». En el tutorial no le llega a nadie."
  result_title: "Práctica: no le llegó a nadie"
  result: "Así se envía. En la semana llega a la campanita y como notificación al teléfono de quienes elegiste."
account:
  title: Tu cuenta
  text: "Toca tu foto: ahí están tu perfil, Configuración y cerrar sesión."
settings_link:
  title: Configuración
  text: "Tócalo."
theme:
  title: Modo oscuro
  text: "En el teléfono viene encendido. Pruébalo: apágalo y préndelo. Esto sí se guarda: es tu preferencia."
simple_mode:
  title: Modo simple
  text: "Es la barra de abajo, a mano del pulgar. Si lo apagas, vuelves al menú completo. Durante el tutorial no se mueve (el tutorial usa la barra); lo cambias al terminar."
push:
  title: Activa las notificaciones
  text: "Toca «Activar en este dispositivo» y luego «Permitir». Así te llegan las alertas al teléfono aunque tengas la app cerrada. En iPhone solo se puede con la app instalada en la pantalla de inicio: si aquí dice que no se puede, instálala primero desde «Instalar la app», un poco más arriba."
done:
  title: ¡Listo para la semana!
  text: "Eso es todo. Si quieres repasarlo, está en Configuración → Ver el tutorial."

# El tutorial del joven (Tutorial#joven_steps): lo de arriba que comparte (la agenda, la alerta de bienvenida,
# «Más», el modo oscuro y las notificaciones) y esto, que es solo suyo.
joven_welcome:
  title: "Hola, %{name}"
  text: "En 2 minutos te mostramos la app del FSY: dónde está tu compañía, tu código QR, la agenda y los avisos. Puedes saltarlo y verlo después desde Configuración."
joven_company:
  title: Tu compañía
  text: "Aquí vas a ver tu compañía. Tócala."
joven_coming_soon:
  title: Próximamente
  text: "Tu compañía se abre el día del evento, cuando termine el registro. Te llega un aviso y aquí aparecen tus consejeros, tu comedor, tu cuarto y tus compañeros."
joven_my_company:
  title: Tus consejeros
  text: "Ellos te acompañan toda la semana. Si te sientes mal o necesitas algo, búscalos primero. Abajo están tus compañeros."
joven_center_qr:
  title: Tu código QR
  text: "El botón amarillo. Lo muestras al llegar al evento para registrar tu llegada."
joven_bell:
  title: La campanita
  text: "Aquí te llegan los avisos de dirección y de tus consejeros, y los cambios de la agenda. Tócala."
joven_photo:
  title: Tu perfil
  text: "Tu foto te lleva a tu perfil: tus datos, tu contacto de emergencia y tu información médica."
joven_sheet:
  title: Lo demás
  text: "Aquí está tu perfil, los manuales del FSY y Configuración. Abajo está «Cerrar sesión»: te pide confirmar, para que no salgas por un toque de más."
joven_sheet_settings:
  title: Configuración
  text: "Toca «Configuración»."
joven_done:
  title: ¡Listo!
  text: "Eso es todo. Nos vemos en el FSY. Si quieres repasarlo, está en Configuración → Ver el tutorial."
