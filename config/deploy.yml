# Despliegue con Kamal a una instancia "Always Free" de Oracle Cloud (OCI).
#
# Shape recomendada: VM.Standard.A1.Flex (Ampere, ARM64) con Ubuntu 24.04.
# El free tier da hasta 4 OCPU / 24 GB repartibles; con 2 OCPU / 12 GB sobra para
# Rails + Postgres. La E2.1.Micro (AMD, 1 GB RAM) tambien es gratis pero se queda
# corta para Rails + Postgres + libvips; si se usa, cambiar builder.arch a amd64.
#
# Los datos propios de cada instalacion se leen de variables de entorno para no
# versionar IPs ni dominios (ver docs/deploy_oracle.md):
#   ORACLE_SERVER_IP  IP publica de la instancia
#   APP_HOST          dominio que apunta a esa IP (p. ej. fsy.midominio.com o
#                     <ip-con-guiones>.sslip.io si no hay dominio propio)
<% server_ip = ENV.fetch("ORACLE_SERVER_IP") { abort "Falta ORACLE_SERVER_IP (IP publica de la instancia de Oracle)" } %>
<% app_host  = ENV.fetch("APP_HOST") { abort "Falta APP_HOST (dominio que apunta a la instancia)" } %>

# Name of your application. Used to uniquely configure containers.
service: fsy_management

# Name of the container image (use your-user/app-name on external registries).
image: menocas17/fsy_management

# Deploy to these servers.
servers:
  web:
    - <%= server_ip %>

# kamal-proxy termina SSL y pide el certificado a Let's Encrypt. Requiere que el
# puerto 80 y 443 esten abiertos en la Security List de la VCN *y* en el
# iptables de la instancia (script/oracle/setup_server.sh lo hace).
proxy:
  ssl: true
  host: <%= app_host %>
  app_port: 80
  healthcheck:
    path: /up

# Where you keep your container images.
registry:
  server: ghcr.io
  username: menocas17
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    - POSTGRES_PASSWORD
  clear:
    APP_HOST: <%= app_host %>
    DB_HOST: fsy_management-db # Nombre del contenedor de la BD en la red interna de Docker
    POSTGRES_USER: fsy_management
    # Solid Queue corre dentro de Puma: un solo contenedor para web + jobs.
    SOLID_QUEUE_IN_PUMA: true
    # Ajustar a los OCPU asignados a la instancia A1.
    WEB_CONCURRENCY: 2
    RAILS_MAX_THREADS: 3

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Archivos de Active Storage (avatares, etc.). Vive en el boot volume de la
# instancia; conviene respaldarlo (ver docs/deploy_oracle.md).
volumes:
  - "fsy_management_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests.
asset_path: /rails/public/assets

# Las instancias Ampere A1 son ARM64. Si la maquina local no es ARM (p. ej. una
# laptop x86), Kamal construye la imagen en el propio servidor por SSH en vez de
# emular con QEMU, que es muchisimo mas lento. En un Mac con Apple Silicon se
# construye localmente.
builder:
  arch: arm64
  remote: ssh://ubuntu@<%= server_ip %>

# Las imagenes de Ubuntu de Oracle no permiten SSH como root; el usuario por
# defecto es "ubuntu" (en Oracle Linux es "opc"). Debe pertenecer al grupo docker.
ssh:
  user: ubuntu

# Use accessory services (secrets come from .kamal/secrets).
accessories:
  db:
    image: postgres:18 # multi-arch, tiene build para arm64
    host: <%= server_ip %>
    # Solo accesible desde la propia maquina; nunca exponer 5432 a internet.
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: fsy_management
        POSTGRES_DB: fsy_management_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      # postgres:18 guarda los datos en /var/lib/postgresql/18/docker y se niega a
      # arrancar si hay un volumen montado en /var/lib/postgresql/data.
      - data:/var/lib/postgresql
