# Despliegue con Kamal a un droplet de DigitalOcean (Ubuntu 24.04, 1 vCPU, 1 GB). La guía está en
# docs/deploy_vps.md. La app y su Postgres viven en la misma máquina: kamal-proxy recibe el tráfico, saca
# el certificado de Let's Encrypt y se lo pasa a Thruster (puerto 80 del contenedor), que se lo pasa a Puma.
#
# Lo propio de cada instalación sale del entorno para no versionar la IP ni el dominio:
#   SERVER_IP  la IP del droplet
#   APP_HOST   el dominio que apunta a esa IP (o <ip-con-guiones>.sslip.io si no hay dominio propio)
<% server_ip = ENV.fetch("SERVER_IP") { abort "Falta SERVER_IP (la IP del droplet)" } %>
<% app_host  = ENV.fetch("APP_HOST") { abort "Falta APP_HOST (el dominio que apunta al droplet)" } %>

service: fsy_management

# En ghcr.io, el registro de GitHub. La imagen se construye en GitHub Actions (x86, como el droplet): en un
# droplet de 1 GB no hay memoria para compilar, y en un Mac con Apple Silicon saldría emulada y lenta.
image: menocas17/fsy_management

servers:
  web:
    - <%= server_ip %>

proxy:
  ssl: true
  host: <%= app_host %>
  app_port: 80
  healthcheck:
    path: /up

registry:
  server: ghcr.io
  username: menocas17
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

# Kamal no entra como root: setup_server.sh crea este usuario con permiso para usar Docker.
ssh:
  user: deploy

env:
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_URL
    - R2_ACCOUNT_ID
    - R2_ACCESS_KEY_ID
    - R2_SECRET_ACCESS_KEY
    - R2_PUBLIC_URL
    - MAIL_RELAY_URL
    - MAIL_RELAY_SECRET
  clear:
    APP_HOST: <%= app_host %>
    R2_BUCKET: fsy-management
    # Solid Queue corre dentro de Puma, en hilos (config/puma.rb): un solo contenedor para web y trabajos.
    SOLID_QUEUE_IN_PUMA: true
    # Un solo proceso de Puma: con 1 GB y Postgres al lado no caben dos.
    RAILS_MAX_THREADS: 3

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Los assets con huella de la versión anterior siguen disponibles mientras se cambia de contenedor.
asset_path: /rails/public/assets

# El disco es de 25 GB: los logs de Docker rotan en vez de crecer sin límite.
logging:
  options:
    max-size: 20m
    max-file: 5

accessories:
  db:
    image: postgres:18
    host: <%= server_ip %>
    # Solo desde la propia máquina (para un túnel SSH); la app llega por la red interna de Docker con el
    # nombre fsy_management-db. Nunca se expone 5432 a internet.
    port: "127.0.0.1:5432:5432"
    # Memoria pensada para 1 GB compartido con la app: Rails usa ~300-400 MB y el sistema ~100 MB.
    cmd: >-
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=384MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c max_connections=40
    env:
      clear:
        POSTGRES_USER: fsy_management
        POSTGRES_DB: fsy_management_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      # postgres:18 guarda los datos en /var/lib/postgresql/18/docker y se niega a arrancar si hay un
      # volumen montado en /var/lib/postgresql/data.
      - data:/var/lib/postgresql
