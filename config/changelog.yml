# Novedades de la app (ChangelogEntry), la más nueva arriba. Cada entrada se anuncia una sola vez en la
# campanita al desplegarse (bin/rails novedades:anunciar, desde bin/docker-entrypoint) y queda en /novedades.
#
#   id:      único y estable, nunca se cambia (con él se recuerda cuál ya se anunció)
#   date:    el día en que sale
#   title:   corto, va en la campanita
#   summary: una o dos frases, el cuerpo de la notificación
#   changes: lo que cambió, una línea por cosa, en palabras de quien usa la app
#   roles:   opcional; sin roles le llega a todos, con roles solo a esos (participants.rol)
- id: 2026-10-09-instalar-la-app
  date: 2026-10-09
  title: Instala la app en tu teléfono
  summary: Al abrir la app desde el navegador del teléfono, te muestra cómo agregarla a tu pantalla de inicio.
  changes:
    - En Android, un botón «Instalar» y listo.
    - En iPhone, los 3 pasos en Safari con dibujos de dónde tocar. Instalada es la única forma de que te lleguen las alertas.
    - Si abriste el enlace desde Facebook, Instagram o Messenger, te ayuda a abrirlo en Safari o Chrome, donde sí se puede instalar.
    - Si dices «Ahora no», vuelve a aparecer al día siguiente. También está en Configuración → Instalar la app.
    - "El tutorial termina mostrándote cómo activar las notificaciones en tu teléfono: Configuración → Notificaciones → Activar en este dispositivo."
- id: 2026-10-09-tutorial
  date: 2026-10-09
  title: Un tutorial de 5 minutos
  summary: La primera vez que entras desde el teléfono, la app te muestra lo que vas a usar en la semana, y lo practicas sin cambiar nada.
  changes:
    - Ilumina una parte de la app a la vez y te pide tocarla, deslizarla o probarla, sobre la app de verdad.
    - "Lo que practicas no se guarda: borrar una capacitación, enviar una alerta, llevar a un joven a enfermería o pasar el Conteo."
    - Consejeros y auxiliares practican con jóvenes de ejemplo que solo aparecen en el tutorial, aunque todavía no tengan jóvenes asignados.
    - Lo puedes saltar cuando quieras y volver a verlo en Configuración → Ver el tutorial.
  roles: [ director, coordinador, auxiliar, consejero, logistica, director_logistica ]
- id: 2026-10-08-oscuro-en-el-telefono
  date: 2026-10-08
  title: Modo oscuro en el teléfono y detalles visuales
  summary: En el teléfono la app arranca en modo oscuro, y se corrigieron la agenda y la gráfica por edad.
  changes:
    - En el teléfono la app se abre en modo oscuro. Si prefieres el claro, apágalo en Configuración → Apariencia y queda guardado.
    - Al abrir una actividad de la agenda en el teléfono, el detalle ya no queda pegado al título y el espacio entre filas es parejo.
    - En la gráfica «Jóvenes por edad» cada número queda justo encima de su barra.
    - En el inicio del teléfono, la cifra del conteo de anoche se llama «Conteo», como el módulo.
- id: 2026-10-08-conteo-y-hojas
  date: 2026-10-08
  title: «Conteo», hojas que se arrastran y capacitaciones
  summary: La asistencia nocturna ahora se llama Conteo, las hojas del teléfono se cierran arrastrándolas y las capacitaciones se borran desde su tarjeta.
  changes:
    - «Asistencia nocturna» ahora se llama «Conteo», en el menú, las alertas y el historial.
    - En el teléfono, el menú «Más» y los filtros (jóvenes, staff, historial) se cierran arrastrándolos hacia abajo.
    - El menú «Más» ya no aparece un instante arriba de la pantalla al cambiar de página.
    - "Capacitaciones: quien edita la agenda borra una capacitación desde su tarjeta (en el teléfono, deslizándola a la izquierda, como las alertas)."
    - El PDF de asistencia a capacitaciones pasó a Reportes; en Capacitaciones quedan «Escanear» y «Nueva», en una sola fila aun en teléfonos angostos.
    - Áreas de logística ya no se desliza de lado en pantallas angostas.
- id: 2026-10-08-acceso-total-direccion
  date: 2026-10-08
  title: Dirección y coordinación entran a todo
  summary: El matrimonio director y los coordinadores ya pueden hacer todo en la app; presentar y aprobar gastos sigue como antes.
  changes:
    - Operan Enfermería completa (ingresar, dar de alta y escribir la ficha clínica).
    - Pasan el Conteo de cualquier compañía y eligen qué registro está activo en el escáner (Configuración).
    - Definen el presupuesto, las categorías y el tipo de cambio de Finanzas.
    - Presentar y aprobar gastos sigue igual que antes.
  roles: [ director, coordinador ]
- id: 2026-10-08-fechas-y-telefonos-angostos
  date: 2026-10-08
  title: Fechas día/mes/año y teléfonos angostos
  summary: Las fechas se escriben y se leen siempre día/mes/año, y las pantallas ya no se rompen en teléfonos angostos.
  changes:
    - Los campos de fecha (nacimiento, actividades, capacitaciones, gastos) son día/mes/año aunque el teléfono esté en inglés; las barras se ponen solas y el botón del calendario sigue ahí.
    - En teléfonos angostos las cifras de tres en fila van una debajo de otra, sin partir palabras («Pendientes», «Confirmadas»).
    - La vista general de compañías muestra cada compañía en una tarjeta en el teléfono, sin tabla que se salga de la pantalla.
    - Ya no se cortan el selector de la agenda, los nombres en «Lo que sigue» ni la lista de asistencia nocturna.
- id: 2026-10-08-reporte-cumpleaneros
  date: 2026-10-08
  title: Reporte de cumpleañeros
  summary: En Reportes ya se imprime la lista de quienes cumplen años en enero y durante la semana del FSY.
  changes:
    - Reportes → Cumpleañeros: primero los que cumplen durante el FSY, con el día de la semana, y luego todo enero; de todos o solo de los jóvenes.
    - Cada uno con su rol, su compañía (o área) y la edad que cumple.
  roles: [ director, coordinador ]
- id: 2026-10-08-edad-de-hoy
  date: 2026-10-08
  title: La edad es la de hoy
  summary: Las fichas muestran la edad que cada persona tiene hoy, y sube sola el día de su cumpleaños.
  changes:
    - Antes se mostraba la edad que tendría el primer día del FSY; ahora es la de hoy, con año, mes y día.
    - Se actualiza sola en fichas, listas, enfermería, reportes y la gráfica por edad del inicio, sin tocar nada.
- id: 2026-10-08-rendimiento-detalle
  date: 2026-10-08
  title: Fotos más livianas y menos carga en el servidor
  summary: Las fotos de perfil llegan ya achicadas desde el teléfono y no pasan por el servidor.
  changes:
    - "Una foto de teléfono de 15 MB o más no es problema: el mismo teléfono la achica a 1600 px antes de subirla (queda en unos 300 a 700 KB)."
    - La foto sube directo al almacenamiento al elegirla, sin pasar por el servidor, así la app no se pone lenta cuando todos los consejeros cargan fotos a la vez.
    - Las cifras generales del inicio se calculan una vez cada 30 segundos para todos, en lugar de una vez por persona.
  roles: [ director, coordinador ]
- id: 2026-10-08-mas-rapida
  date: 2026-10-08
  title: La app responde más rápido
  summary: Las páginas que más se abren tardan menos.
  changes:
    - En el teléfono, la agenda carga más rápido; el detalle de cada actividad aparece al abrirla.
    - El inicio, las fichas y la página de tu compañía responden más rápido.
- id: 2026-10-08-foto-subida-directa
  date: 2026-10-08
  title: La foto se sube al elegirla
  summary: Al cambiar la foto de una ficha, empieza a subirse en ese momento y ves el avance; al guardar ya está lista.
  changes:
    - Al elegir una foto aparece «Subiendo foto…» con el porcentaje y luego «Foto lista».
    - Puedes seguir llenando la ficha mientras sube; si guardas antes, espera a que termine.
    - Si la conexión falla, la foto se manda igual al guardar, como antes.
- id: 2026-10-07-ajustes-modo-simple
  date: 2026-10-07
  title: Ajustes al modo simple y al escáner
  summary: La cifra de enfermería del inicio es más corta y el escáner de capacitaciones vuelve a donde lo abriste.
  changes:
    - En el inicio del teléfono la cifra dice «Enfermería», con «Ahora» en gris junto al icono.
    - Al escanear la asistencia desde una capacitación, «Volver» te lleva a esa capacitación (o a la lista de capacitaciones), no al inicio.
  roles: [ director, coordinador, auxiliar, consejero, logistica, director_logistica ]
- id: 2026-10-07-modo-simple
  date: 2026-10-07
  title: Modo simple en el teléfono
  summary: En el teléfono el menú ahora vive abajo, a mano del pulgar, y el inicio muestra solo tus cifras.
  changes:
    - Una barra inferior con Inicio, lo tuyo, Agenda y «Más» reemplaza al menú lateral.
    - El botón del centro abre la búsqueda en toda la app o tu código QR.
    - El inicio muestra las tres cifras de tu rol y las gráficas por estaca y por rol.
    - Puedes apagarlo en Configuración → Modo simple. En la computadora no cambia nada.
  roles: [ director, coordinador, auxiliar, consejero, logistica, director_logistica ]
