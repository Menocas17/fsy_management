default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # Las fotos tienen su propio carril: una alerta a todos (cientos de push) no atrasa las miniaturas.
    # Los hilos son las fotos que se procesan a la vez (config/initializers/image_processing.rb).
    - queues: images
      threads: <%= ENV.fetch("IMAGE_JOB_CONCURRENCY", 1) %>
      processes: 1
      polling_interval: 0.1
    - queues: "*"
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
